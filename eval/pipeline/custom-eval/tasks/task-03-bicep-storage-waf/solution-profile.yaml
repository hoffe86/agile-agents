identity:
  project_name: "Synthetic Azure storage module benchmark"
  lifecycle_stage: poc
documentation:
  platform: in-repo
  location: docs/
  adr:
    location: docs/adr/
    format: madr
backlog:
  platform: none
  create_tasks: false
tech_stack:
  primary_languages:
    - name: bicep
      version: "0.38"
  frameworks: []
  test_discipline: test-after
  test_frameworks: []
  lint_format_tools: [bicep]
  build_tools: [bicep]
infrastructure:
  cloud: azure
  iac_tool: bicep
  deploy_verify: "off"
quality_gates:
  test_bar:
    enabled: true
    fail_fast: true
    stacks: [bicep]
    lint:
      command: [bicep, lint, modules/storage-account.bicep]
    typecheck:
      command: [bicep, build, modules/storage-account.bicep]
    unit_test:
      enabled: false
