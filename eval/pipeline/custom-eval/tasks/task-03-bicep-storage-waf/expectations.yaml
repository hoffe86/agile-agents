# Trajectory expectations for task-03-bicep-storage-waf; criteria stay verbatim in acceptance.md.
# Skills are the contract's core loads only -- see eval/pipeline/custom-eval/README.md.
schema: 1
root_agent: dev-lead
plan_gate: required
agents: [infrastructure, review-lead, infrastructure-reviewer, security-reviewer]
skills:
  dev-lead: [read-repo-context, dev-lead-templates]
  infrastructure: [read-repo-context, iac-best-practices, bicep-implementation]
  infrastructure-reviewer: [read-repo-context, reviewer-read-only-rules]
  security-reviewer: [read-repo-context, reviewer-read-only-rules]
  review-lead: [read-repo-context, reviewer-read-only-rules]
forbidden_skills:
  review-lead: [code-review-checklist, code-review]
checks:
  # Bicep diagnostics read "file(line,col) : Warning rule: ..."; az bicep exits 0 on warnings.
  - criterion: 1
    run: [az, bicep, build, --file, modules/storage-account.bicep, --stdout]
    requires: [[az, bicep, version]]
    fail_if_output_matches: '\(\d+,\d+\) : (Warning|Error) '
  - criterion: 1
    run: [az, bicep, build, --file, examples/storage-account-consumer.bicep, --stdout]
    requires: [[az, bicep, version]]
    fail_if_output_matches: '\(\d+,\d+\) : (Warning|Error) '
