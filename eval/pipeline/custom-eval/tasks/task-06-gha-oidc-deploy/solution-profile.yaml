identity:
  project_name: "Synthetic Orders web deployment workflow benchmark"
  lifecycle_stage: poc
documentation:
  platform: in-repo
  location: docs/
  adr:
    location: docs/adr/
    format: madr
backlog:
  platform: none
  create_tasks: false
tech_stack:
  primary_languages:
    - name: csharp
      version: net9.0
    - name: yaml
      version: "1.2"
  frameworks: [aspnetcore, github-actions]
  package_managers: [nuget]
  test_discipline: test-after
  test_frameworks: [xunit]
  lint_format_tools: [actionlint, dotnet-format]
  build_tools: [dotnet]
infrastructure:
  cloud: azure
  deploy_verify: "off"
quality_gates:
  test_bar:
    enabled: true
    fail_fast: true
    stacks: [csharp]
    lint:
      command: [actionlint, .github/workflows/deploy-prod.yml]
    typecheck:
      command: [dotnet, build, Web.slnx, --no-restore, -warnaserror]
    unit_test:
      command: [dotnet, test, Web.slnx, --no-build]
