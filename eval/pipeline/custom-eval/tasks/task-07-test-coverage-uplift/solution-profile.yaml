identity:
  project_name: "Synthetic payment reconciliation test benchmark"
  lifecycle_stage: poc
documentation:
  platform: in-repo
  location: docs/
  adr:
    location: docs/adr/
    format: madr
backlog:
  platform: none
  create_tasks: false
tech_stack:
  primary_languages:
    - name: csharp
      version: net10.0
  frameworks: [aspnetcore]
  package_managers: [nuget]
  test_discipline: test-after
  test_frameworks: [xunit, nsubstitute, testcontainers]
  coverage_threshold: 90
  lint_format_tools: [dotnet-format]
  build_tools: [dotnet]
infrastructure:
  deploy_verify: "off"
quality_gates:
  test_bar:
    enabled: true
    fail_fast: true
    stacks: [csharp]
    lint:
      command: [dotnet, format, Reconciliation.slnx, --verify-no-changes]
    typecheck:
      command: [dotnet, build, Reconciliation.slnx, --no-restore, -warnaserror]
    unit_test:
      # The solution builds production only; newly authored test projects need restore/build.
      command: [dotnet, test, tests/Reconciliation.Tests/Reconciliation.Tests.csproj]
    integration_test:
      enabled: true
      command: [dotnet, test, tests/Reconciliation.IntegrationTests/Reconciliation.IntegrationTests.csproj]
    coverage:
      enabled: true
      command: [dotnet, test, tests/Reconciliation.Tests/Reconciliation.Tests.csproj, /p:CollectCoverage=true, /p:Threshold=90, /p:ThresholdType=line]
