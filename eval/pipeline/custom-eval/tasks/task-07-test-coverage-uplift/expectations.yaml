# Trajectory expectations for task-07-test-coverage-uplift; criteria stay verbatim in acceptance.md.
# Skills are the contract's core loads only -- see eval/pipeline/custom-eval/README.md.
schema: 1
root_agent: dev-lead
plan_gate: required
agents: [coding, review-lead, code-reviewer, test-reviewer]
skills:
  dev-lead: [read-repo-context, dev-lead-templates]
  coding: [read-repo-context, testing-practices, csharp-testing]
  code-reviewer: [read-repo-context, reviewer-read-only-rules, code-review-checklist]
  test-reviewer: [read-repo-context, reviewer-read-only-rules]
  review-lead: [read-repo-context, reviewer-read-only-rules]
forbidden_skills:
  review-lead: [code-review-checklist, code-review]
checks:
  - criterion: 1
    run: [dotnet, test, tests/Reconciliation.Tests]
    on_pass: judge   # the judge still checks >= 8 methods covering the 5 rules
  - criterion: 2
    run: [dotnet, test, tests/Reconciliation.IntegrationTests]
    requires: [[docker, info]]
    timeout: 1200
    on_pass: judge   # the judge still checks a Testcontainers PostgreSQL fixture is used
