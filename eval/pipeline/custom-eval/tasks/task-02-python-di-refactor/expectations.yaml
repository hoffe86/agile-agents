# Trajectory expectations for task-02-python-di-refactor; criteria stay verbatim in acceptance.md.
# Skills are the contract's core loads only -- see eval/pipeline/custom-eval/README.md.
schema: 1
root_agent: dev-lead
plan_gate: required
agents: [coding, review-lead, code-reviewer, security-reviewer]
skills:
  dev-lead: [read-repo-context, dev-lead-templates]
  coding: [read-repo-context, development-practices, testing-practices, python-implementation, python-testing]
  code-reviewer: [read-repo-context, reviewer-read-only-rules, code-review-checklist]
  security-reviewer: [read-repo-context, reviewer-read-only-rules]
  review-lead: [read-repo-context, reviewer-read-only-rules]
forbidden_skills:
  review-lead: [code-review-checklist, code-review]
checks:
  - criterion: 3
    run: ["{python}", -m, pytest, -q, -p, no:cacheprovider]
    requires: [["{python}", -m, pytest, --version]]
    on_pass: judge   # the judge still checks the test file has no monkeypatch
  - criterion: 4
    run: ["{python}", -m, mypy, --strict, invoice_summariser.py, app.py]
    requires: [["{python}", -c, "import mypy, fastapi"]]
