replicaCount: 1

image:
  repository: ghcr.io/example/orders-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

networkPolicy:
  enabled: true
  ingressNamespace: orders

ingress:
  # The chart has no Ingress resource; this is the application's advertised base URL.
  host: orders.example.invalid

config:
  ASPNETCORE_ENVIRONMENT: Production
  LOG_LEVEL: Information
