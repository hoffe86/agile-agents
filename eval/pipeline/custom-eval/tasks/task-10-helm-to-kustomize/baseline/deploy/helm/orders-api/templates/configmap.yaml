apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orders-api.name" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.config.ASPNETCORE_ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  # Application configuration only; this chart does not create a Kubernetes Ingress.
  PUBLIC_BASE_URL: {{ .Values.ingress.host | quote }}
