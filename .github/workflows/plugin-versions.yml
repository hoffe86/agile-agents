name: Plugin versions

on:
  push:
  pull_request:
  workflow_dispatch:

# The version is the delivery mechanism -- an installed plugin picks up nothing until it
# moves, so an unbumped fix ships to nobody. This was missed twice before anything
# enforced it: PR #3 left seven plugins at 0.1.0 (two of them instructing agents to load
# skills that no longer existed), and PR #7 nearly shipped three more.
#
# Bumping is per PR, not per commit, so the bump check only runs on pull_request and
# compares against the merge base. On push only the cheap consistency check runs.

jobs:
  plugin-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bump check diffs against the merge base. Not conditional --
          # `<cond> && 0 || 1` always yields 1, because 0 is falsy in Actions expressions.
          fetch-depth: 0

      - name: Check plugin versions
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            git fetch --no-tags --quiet origin "$env:GITHUB_BASE_REF"
            ./scripts/check-plugin-versions.ps1 -BaseRef "origin/$env:GITHUB_BASE_REF"
          } else {
            ./scripts/check-plugin-versions.ps1
          }

  solution-profile-canvas:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/solution-profile-canvas
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test the shipped canvas without installing dependencies
        run: npm test

      - name: Restore locked build dependencies without install scripts
        run: npm ci --ignore-scripts --no-bin-links --no-audit --no-fund

      - name: Verify the shipped bundle and license match the lock
        run: npm run check:bundle
