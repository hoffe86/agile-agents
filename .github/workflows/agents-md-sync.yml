name: AGENTS.md sync check

on:
  push:
    paths:
      - 'solution-profile.yaml'
      - 'plugins/agile-agents-core/agents/**'
      - 'plugins/agile-agents*/skills/**'
      - 'scripts/generate-agents-md.*'
      - 'scripts/references/agents-md-template.md'
      - 'AGENTS.md'
      - '.github/workflows/agents-md-sync.yml'
  pull_request:
    paths:
      - 'solution-profile.yaml'
      - 'plugins/agile-agents-core/agents/**'
      - 'plugins/agile-agents*/skills/**'
      - 'scripts/generate-agents-md.*'
      - 'scripts/references/agents-md-template.md'
      - 'AGENTS.md'
  workflow_dispatch:

jobs:
  check-agents-md-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate AGENTS.md from solution-profile.yaml
        shell: pwsh
        run: |
          ./scripts/generate-agents-md.ps1 `
            -ProfilePath solution-profile.yaml `
            -Output      AGENTS.md

      - name: Fail if AGENTS.md drifted from sources
        run: |
          if ! git diff --exit-code -I'^> Generated from' -- AGENTS.md; then
            echo "::error::AGENTS.md is out of sync with solution-profile.yaml / agents / skills."
            echo "Run: pwsh scripts/generate-agents-md.ps1 and commit the result."
            exit 1
          fi

      # The .sh generator is a hand-maintained twin of the .ps1 that CI never runs
      # otherwise, so it silently rots. Prove the two still agree.
      - name: Fail if the bash generator drifted from the PowerShell one
        run: |
          git checkout -- AGENTS.md
          ./scripts/generate-agents-md.sh --profile solution-profile.yaml --output /tmp/agents-sh.md
          if ! diff -u -I'^> Generated from' AGENTS.md /tmp/agents-sh.md; then
            echo "::error::generate-agents-md.sh produces different output than the .ps1."
            exit 1
          fi

