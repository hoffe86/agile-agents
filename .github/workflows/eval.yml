name: Run eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        type: choice
        options:
          - custom-eval
          - swe-bench-subset
        default: custom-eval
      task_filter:
        description: 'Only run tasks whose ID matches this regex'
        type: string
        default: '.*'
      pass_threshold:
        description: 'Resolved%% needed to exit 0 (see note below)'
        type: string
        default: '0'
      dry_run:
        description: 'Render the copilot command per task without executing (no auth/credits)'
        type: boolean
        default: true

# ponytail: dry_run defaults true so a manual run validates the dev-lead wiring on a bare
# runner — no copilot install, no auth, no credits. A real run (dry_run:false) needs a
# Copilot-authenticated runner (the agent run AND the LLM judge both call copilot), so the
# threshold default 0 keeps it green while you calibrate. Raise the threshold + add push/PR
# triggers once you trust the scores. ubuntu-latest ships bash + jq.

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run eval harness
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          bash eval/run-eval.sh \
            --suite "${{ inputs.suite }}" \
            --task-filter "${{ inputs.task_filter }}" \
            --pass-threshold "${{ inputs.pass_threshold }}" \
            $DRY

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Eval result — ${{ inputs.suite }}"
            echo '```json'
            cat eval/runs/*/summary.json 2>/dev/null || echo 'no summary.json produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.suite }}-${{ github.run_id }}
          path: eval/runs/
          if-no-files-found: error
