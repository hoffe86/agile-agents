name: Native local sandbox proof (no models)

on:
  push:
    branches: [feat/live-evaluation-authorization]
    paths:
      - .github/workflows/native-local-sandbox-proof.yml
      - eval/pipeline/native-local-sandbox-proof/**

permissions: {}

concurrency:
  group: native-local-sandbox-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eval/pipeline/native-local-sandbox-proof
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Unit checks (no runtime invocation)
        run: python -m unittest -v test_proof
      - name: Install native prerequisites from signed fixed Ubuntu snapshot
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          # Dedicated source avoids floating runner sources and third-party repositories.
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20261015T000000Z noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20261015T000000Z noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20261015T000000Z noble-security main universe' \
            | sudo dd of=/etc/apt/native-sandbox-proof.list status=none
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/native-sandbox-proof.list
                       -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y bubblewrap slirp4netns util-linux iptables
          dpkg-query -W bubblewrap slirp4netns util-linux iptables
          bwrap --version
          iptables --version
          test -r /dev/net/tun && test -w /dev/net/tun
      - name: Install hash-locked SDK and CLI
        id: runtime
        run: |
          python -m venv "$RUNNER_TEMP/native-proof-venv"
          "$RUNNER_TEMP/native-proof-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements.txt
          python setup_runtime.py "$RUNNER_TEMP/native-proof-runtime"
      - name: Exercise Copilot native tool pipeline
        run: |
          env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            "$RUNNER_TEMP/native-proof-venv/bin/python" proof.py \
            "$RUNNER_TEMP/native-proof-runtime/copilot" evidence/available.json
      - name: Missing backend must not silently execute
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        id: unavailable
        run: |
          test -x "$RUNNER_TEMP/native-proof-runtime/copilot"
          sudo mv /usr/bin/bwrap /usr/bin/bwrap.native-proof-disabled
          trap 'sudo mv /usr/bin/bwrap.native-proof-disabled /usr/bin/bwrap' EXIT
          env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            "$RUNNER_TEMP/native-proof-venv/bin/python" proof.py \
            "$RUNNER_TEMP/native-proof-runtime/copilot" evidence/unavailable.json --unavailable
      - name: Publish synthetic evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-local-sandbox-proof
          path: eval/pipeline/native-local-sandbox-proof/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable proof runtime
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/native-proof-runtime" "$RUNNER_TEMP/native-proof-venv"
