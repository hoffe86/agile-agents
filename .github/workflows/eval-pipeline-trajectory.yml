name: Eval · pipeline trajectory (L0)

on:
  push:
  pull_request:
  workflow_dispatch:

# L0 eval: deterministic, zero-credit, no secrets. Asserts the run-event-log stream
# conforms to the RPI pipeline shape (see docs/adr/0008). Safe to gate on — unlike the
# credit-heavy outcome eval (Run eval workflow), this calls no model.

jobs:
  trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test the checker
        run: python eval/pipeline/trajectory/check-trajectory.py --self-test

      - name: Fixture is in sync with the generator
        run: |
          python eval/pipeline/trajectory/check-trajectory.py --emit-fixture /tmp/regen.jsonl
          if ! diff -u eval/pipeline/trajectory/fixtures/full-run.events.jsonl /tmp/regen.jsonl; then
            echo "::error::full-run.events.jsonl is out of sync with build_golden(). Re-run --emit-fixture and commit."
            exit 1
          fi

      - name: Check the golden trajectory
        run: python eval/pipeline/trajectory/check-trajectory.py eval/pipeline/trajectory/fixtures/full-run.events.jsonl

  task02-lock-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
      TASK: task-02
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned evaluation lock
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt
      - name: Install task 02 Python tools
        run: |
          if [[ "$TASK" == task-02 || "$TASK" == task-02-* ]]; then
            python -m pip --isolated install --require-hashes --only-binary=:all: \
              --requirement eval/pipeline/custom-eval/requirements-task02.lock.txt
            python -m pip check
          fi
      - name: Verify the task environment
        run: |
          python -m pip --isolated install --dry-run --no-index \
            --requirement eval/pipeline/custom-eval/tasks/task-02-python-di-refactor/baseline/requirements-dev.txt
          python eval/deepeval/check_environment.py
          cd eval/pipeline/custom-eval/tasks/task-02-python-di-refactor/baseline
          python -m pytest -q -p no:cacheprovider
