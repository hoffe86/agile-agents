name: Eval · pipeline trajectory (L0)

on:
  push:
  pull_request:
  workflow_dispatch:

# L0 eval: deterministic, zero-credit, no secrets. Asserts the run-event-log stream
# conforms to the RPI pipeline shape (see docs/adr/0008). Safe to gate on — unlike the
# credit-heavy outcome eval (Run eval workflow), this calls no model.

jobs:
  trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test the checker
        run: python eval/pipeline/trajectory/check-trajectory.py --self-test

      - name: Fixture is in sync with the generator
        run: |
          python eval/pipeline/trajectory/check-trajectory.py --emit-fixture /tmp/regen.jsonl
          if ! diff -u eval/pipeline/trajectory/fixtures/full-run.events.jsonl /tmp/regen.jsonl; then
            echo "::error::full-run.events.jsonl is out of sync with build_golden(). Re-run --emit-fixture and commit."
            exit 1
          fi

      - name: Check the golden trajectory
        run: python eval/pipeline/trajectory/check-trajectory.py eval/pipeline/trajectory/fixtures/full-run.events.jsonl

  azure-judge-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hoffe86-congenial-system'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
      AZURE_OPENAI_ENDPOINT: ${{ vars.EVAL_AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.EVAL_AZURE_OPENAI_DEPLOYMENT }}
      PYTHONPATH: eval/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned evaluation lock
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt
      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474
        with:
          client-id: ${{ vars.EVAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EVAL_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Diagnose inference authorization
        run: |
          python - <<'PY'
          import base64
          import json
          import subprocess
          from uuid import UUID

          from agile_eval.custom_eval.judges import azure_openai_model

          result = subprocess.run(
              ["az", "account", "get-access-token", "--resource",
               "https://cognitiveservices.azure.com", "--output", "json"],
              capture_output=True, text=True, check=True,
          )
          token = json.loads(result.stdout)["accessToken"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("principal_object_id=" + str(UUID(claims["oid"])))
          print("expected_audience=" + str(
              claims.get("aud") == "https://cognitiveservices.azure.com"
          ))
          try:
              azure_openai_model().generate("Reply with OK.")
              print("inference=success")
          except Exception as error:
              status = getattr(error, "status_code", None)
              print("http_status=" + (
                  str(status) if type(status) is int and 100 <= status <= 599 else "unavailable"
              ))
              body = getattr(error, "body", None)
              info = body.get("error", body) if isinstance(body, dict) else {}
              code = info.get("code") if isinstance(info, dict) else None
              known = {"PermissionDenied", "Unauthorized", "UnauthorizedAccess",
                       "AccessDenied", "InvalidAuthenticationToken", "InvalidToken"}
              print("azure_code=" + (code if isinstance(code, str) and code in known
                                     else "unrecognized"))
              message = info.get("message", "") if isinstance(info, dict) else ""
              message = message.lower() if isinstance(message, str) else ""
              print("mentions_permission=" + str("permission" in message))
              print("mentions_access=" + str("access" in message))
              print("mentions_audience=" + str("audience" in message))
          PY
      - name: Judge synthetic plans
        run: |
          python - <<'PY'
          from agile_eval.custom_eval.expectations import Criterion
          from agile_eval.custom_eval.plan_approval import decide

          criterion = (Criterion(1, "The plan includes a test of the greeting endpoint."),)
          requirement = "Add a greeting endpoint and test it."
          for plan, expected in (
              ("Plan: Add the greeting endpoint and run a test of its response.", True),
              ("Plan: Add the greeting endpoint.", False),
          ):
              decision = decide(requirement, criterion, plan)
              print(f"approved={decision.approved}, criteria="
                    f"{[(item.id, item.status) for item in decision.judgement.criteria]}")
              if decision.approved != expected:
                  raise SystemExit("Synthetic plan received the wrong decision.")
          PY
