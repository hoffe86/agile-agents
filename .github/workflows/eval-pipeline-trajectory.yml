name: Eval · pipeline trajectory (L0)

on:
  push:
  pull_request:
  workflow_dispatch:

# L0 eval: deterministic, zero-credit, no secrets. Asserts the run-event-log stream
# conforms to the RPI pipeline shape (see docs/adr/0008). Safe to gate on — unlike the
# credit-heavy outcome eval (Run eval workflow), this calls no model.

jobs:
  trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test the checker
        run: python eval/pipeline/trajectory/check-trajectory.py --self-test

      - name: Fixture is in sync with the generator
        run: |
          python eval/pipeline/trajectory/check-trajectory.py --emit-fixture /tmp/regen.jsonl
          if ! diff -u eval/pipeline/trajectory/fixtures/full-run.events.jsonl /tmp/regen.jsonl; then
            echo "::error::full-run.events.jsonl is out of sync with build_golden(). Re-run --emit-fixture and commit."
            exit 1
          fi

      - name: Check the golden trajectory
        run: python eval/pipeline/trajectory/check-trajectory.py eval/pipeline/trajectory/fixtures/full-run.events.jsonl

  azure-judge-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hoffe86-congenial-system' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_OPENAI_ENDPOINT: ${{ vars.EVAL_AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.EVAL_AZURE_OPENAI_DEPLOYMENT }}
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
      DEEPEVAL_DISABLE_PROGRESS_BAR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONPATH: eval/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the pinned evaluation environment
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all:
          --requirement eval/deepeval/requirements.lock.txt

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.EVAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EVAL_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Judge a synthetic plan
        shell: python
        run: |
          import os
          import re
          from urllib.parse import urlsplit, urlunsplit

          endpoint = urlsplit(os.environ["AZURE_OPENAI_ENDPOINT"])
          if (endpoint.scheme != "https" or not endpoint.hostname
                  or not endpoint.hostname.endswith((".openai.azure.com", ".services.ai.azure.com"))
                  or endpoint.username is not None or endpoint.password is not None
                  or endpoint.port is not None or endpoint.query or endpoint.fragment
                  or endpoint.path.rstrip("/") != "/openai/v1/responses"):
              raise SystemExit("::error::The configured endpoint is not the expected Azure Responses URL")
          if any(name in os.environ for name in ("AZURE_OPENAI_API_KEY", "AZURE_OPENAI_AD_TOKEN")):
              raise SystemExit("::error::Unexpected ambient Azure API credential")
          os.environ["AZURE_OPENAI_ENDPOINT"] = urlunsplit(
              (endpoint.scheme, endpoint.netloc, "", "", "")
          )
          print("Using the resource root for this probe only; the repository variable is unchanged.")

          from agile_eval.custom_eval import judges, plan_approval
          from agile_eval.custom_eval.expectations import Criterion

          model = judges.azure_openai_model()

          class DiagnosticModel:
              def generate(self, prompt):
                  try:
                      return model.generate(prompt)
                  except Exception as exc:
                      status = getattr(exc, "status_code", None)
                      code = getattr(exc, "code", None)
                      safe_code = code if isinstance(code, str) and re.fullmatch(r"[A-Za-z0-9._-]{1,80}", code) else "unavailable"
                      print(f"::error::Synthetic inference failed: {type(exc).__name__}; HTTP {status}; code {safe_code}")
                      raise

          plan_approval.azure_openai_model = DiagnosticModel
          decision = plan_approval.decide(
              "Add a health endpoint.",
              (Criterion(1, "The plan explicitly lists adding a health endpoint."),),
              "Task: Add a health endpoint. Verify it returns HTTP 200.",
          )
          print(f"Synthetic plan judge decision: {'approved' if decision.approved else 'rejected'}")
          if not decision.approved:
              raise SystemExit("::error::The synthetic plan was not approved")
