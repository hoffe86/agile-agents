name: Eval · pipeline trajectory (L0)

on:
  push:
  pull_request:
  workflow_dispatch:

# L0 eval: deterministic, zero-credit, no secrets. Asserts the run-event-log stream
# conforms to the RPI pipeline shape (see docs/adr/0008). Safe to gate on — unlike the
# credit-heavy outcome eval (Run eval workflow), this calls no model.

jobs:
  trajectory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test the checker
        run: python eval/pipeline/trajectory/check-trajectory.py --self-test

      - name: Fixture is in sync with the generator
        run: |
          python eval/pipeline/trajectory/check-trajectory.py --emit-fixture /tmp/regen.jsonl
          if ! diff -u eval/pipeline/trajectory/fixtures/full-run.events.jsonl /tmp/regen.jsonl; then
            echo "::error::full-run.events.jsonl is out of sync with build_golden(). Re-run --emit-fixture and commit."
            exit 1
          fi

      - name: Check the golden trajectory
        run: python eval/pipeline/trajectory/check-trajectory.py eval/pipeline/trajectory/fixtures/full-run.events.jsonl

  azure-judge-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hoffe86-congenial-system'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
      AZURE_OPENAI_ENDPOINT: ${{ vars.EVAL_AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.EVAL_AZURE_OPENAI_DEPLOYMENT }}
      PYTHONPATH: eval/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned evaluation lock
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt
      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474
        with:
          client-id: ${{ vars.EVAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EVAL_AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Diagnose model API compatibility
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          from agile_eval.custom_eval.judges import azure_openai_model

          model = azure_openai_model()
          print("deepeval_temperature=" + str(model.temperature))
          print("deepeval_supports_temperature=" + str(model.supports_temperature()))
          token = json.loads(subprocess.run(
              ["az", "account", "get-access-token", "--resource",
               "https://cognitiveservices.azure.com", "--output", "json"],
              capture_output=True, text=True, check=True,
          ).stdout)["accessToken"]
          endpoint = os.environ["AZURE_OPENAI_ENDPOINT"].rstrip("/")
          deployment = os.environ["AZURE_OPENAI_DEPLOYMENT"]
          messages = [{"role": "user", "content": [{"type": "text", "text": "Reply with OK."}]}]

          def probe(name, path, body):
              request = Request(
                  endpoint + path,
                  data=json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=90) as response:
                      result = json.load(response)
                  result_type = result.get("object")
                  result_type = result_type if result_type in ("chat.completion", "response") else "unrecognized"
                  print(f"{name}: status=success, object={result_type}")
                  return True
              except HTTPError as error:
                  try:
                      info = json.loads(error.read()).get("error", {})
                  except (ValueError, AttributeError):
                      info = {}
                  if not isinstance(info, dict):
                      info = {}
                  code = info.get("code")
                  code = code if isinstance(code, str) and re.fullmatch(r"[A-Za-z_]{1,48}", code) else "unrecognized"
                  param = info.get("param")
                  known_params = {"temperature", "model", "messages", "api_version", "max_tokens", "max_completion_tokens"}
                  param = param if isinstance(param, str) and param in known_params else "unrecognized"
                  message = info.get("message", "")
                  message = message.lower() if isinstance(message, str) else ""
                  print(f"{name}: status=HTTP_{error.code}, code={code}, param={param}, "
                        f"temperature={'temperature' in message}, unsupported={'support' in message}, "
                        f"api_version={'api version' in message or 'api-version' in message}")
                  return False

          legacy = "/openai/deployments/" + quote(deployment, safe="") + "/chat/completions?api-version=2024-10-21"
          probe("legacy_temperature_zero", legacy, {"model": deployment, "messages": messages, "temperature": 0})
          without_temperature = probe("legacy_temperature_omitted", legacy, {"model": deployment, "messages": messages})
          if not without_temperature:
              probe("v1_chat", "/openai/v1/chat/completions", {"model": deployment, "messages": messages})
              probe("v1_responses", "/openai/v1/responses", {"model": deployment, "input": "Reply with OK."})
          PY
      - name: Judge synthetic plans
        run: |
          python - <<'PY'
          from agile_eval.custom_eval.expectations import Criterion
          from agile_eval.custom_eval.plan_approval import decide

          criterion = (Criterion(1, "The plan includes a test of the greeting endpoint."),)
          requirement = "Add a greeting endpoint and test it."
          for plan, expected in (
              ("Plan: Add the greeting endpoint and run a test of its response.", True),
              ("Plan: Add the greeting endpoint.", False),
          ):
              decision = decide(requirement, criterion, plan)
              print(f"approved={decision.approved}, criteria="
                    f"{[(item.id, item.status) for item in decision.judgement.criteria]}")
              if decision.approved != expected:
                  raise SystemExit("Synthetic plan received the wrong decision.")
          PY
