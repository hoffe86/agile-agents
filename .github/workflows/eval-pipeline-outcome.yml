name: Eval · pipeline outcome (L2)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        type: choice
        options:
          - custom-eval
          - swe-bench-subset
        default: custom-eval
      task_filter:
        description: 'Only run tasks whose ID matches this regex'
        type: string
        default: '.*'
      pass_threshold:
        description: 'Resolved percent (0-100) needed to exit 0'
        type: string
        default: '0'
      dry_run:
        description: 'Offline fixture preflight/staging only (no agent or judge calls)'
        type: boolean
        default: true
      native_only:
        description: 'No-model native boundary qualification only; does not release the live hold'
        type: boolean
        default: false

# Live evaluation is disabled until a credential-free, network-disabled OS sandbox is available.
# Keep dry_run=true for fixture preflight/staging. False fails closed without installing the CLI
# or exposing credentials in pipeline-outcome. Native qualification is a separate opt-in,
# not a benchmark, Stage 4/delegation fidelity proof, or permission to lift the controller hold.

permissions:
  contents: read

jobs:
  pipeline-outcome:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.native_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Eval · pipeline outcome (L2) harness
        env:
          EVAL_SUITE: ${{ inputs.suite }}
          TASK_FILTER: ${{ inputs.task_filter }}
          PASS_THRESHOLD: ${{ inputs.pass_threshold }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ ! "$PASS_THRESHOLD" =~ ^[0-9]{1,3}$ ]] || (( 10#$PASS_THRESHOLD > 100 )); then
            echo "::error::pass_threshold must be an integer from 0 through 100"
            exit 1
          fi
          RUN_ARGS=(--suite "$EVAL_SUITE" --task-filter "$TASK_FILTER" --pass-threshold "$PASS_THRESHOLD")
          if [[ "$DRY_RUN" == "true" ]]; then
            RUN_ARGS+=(--dry-run)
          fi
          bash eval/pipeline/run-eval.sh "${RUN_ARGS[@]}"

      - name: Write summary
        if: always()
        env:
          EVAL_SUITE: ${{ inputs.suite }}
        run: |
          {
            echo "## Eval result — $EVAL_SUITE"
            echo '```json'
            cat eval/pipeline/runs/*/summary.json 2>/dev/null || echo 'no summary.json produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        env:
          EVAL_SUITE: ${{ inputs.suite }}
        with:
          name: eval-${{ env.EVAL_SUITE }}-${{ github.run_id }}
          path: eval/pipeline/runs/
          if-no-files-found: error

  native-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set qualification paths
        shell: bash
        run: |
          echo "COPILOT_CLI_EXTRACT_DIR=$RUNNER_TEMP/native-runtime-1.0.105" >> "$GITHUB_ENV"
          echo "EVAL_PYTHON=$RUNNER_TEMP/eval-venv/bin/python" >> "$GITHUB_ENV"

      # Official Linux prerequisites; Noble package pins verified 2026-10-22.
      # sudo is only for apt provisioning, never sandbox execution or policy changes.
      - name: Install native host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          apt-cache policy bubblewrap slirp4netns
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap=0.9.0-1ubuntu0.3 slirp4netns=1.2.1-1build2
          dpkg-query --show --showformat='${Package}=${Version}\n' bubblewrap slirp4netns

      # Check availability only; Copilot owns sandbox lifecycle/policy through MXC.
      # The SDK native driver must verify host support and effective boundaries.
      # Never change AppArmor/sysctl or elevate execution after a policy denial.
      - name: Require native host prerequisites
        shell: bash
        run: |
          for executable in bwrap slirp4netns; do
            if ! command -v "$executable"; then
              echo "::error::native prerequisite missing: $executable"
              exit 1
            fi
          done
          if [[ ! -x /usr/bin/python3 ]]; then
            echo "::error::native prerequisite missing: /usr/bin/python3"
            exit 1
          fi

      - name: Create a clean evaluation environment
        run: python -m venv "$RUNNER_TEMP/eval-venv"

      # Trusted provisioning only: reviewed SDK 1.0.28 lock and publisher-managed runtime 1.0.105 hashes.
      - name: Download hash-verified evaluation wheels
        run: >-
          "$EVAL_PYTHON" -m pip --isolated download --index-url https://pypi.org/simple
          --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/eval-wheels"
          --requirement eval/deepeval/requirements.lock.txt

      - name: Install evaluation wheels without an index
        run: >-
          "$EVAL_PYTHON" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/eval-wheels"
          --require-hashes --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt

      - name: Check the installed dependency closure
        run: '"$EVAL_PYTHON" -m pip check'

      - name: Provision the publisher-pinned runtime
        run: '"$EVAL_PYTHON" -m copilot download-runtime'

      - name: Offline native qualification contracts
        env:
          COPILOT_SKIP_CLI_DOWNLOAD: '1'
        run: >-
          "$EVAL_PYTHON" -m unittest discover -s eval/pipeline/tests
          -p test_native_runtime_integration.py -v

      # Driver emits only allowlisted diagnostics, never raw runtime output.
      # It owns its temporary session/process group and performs actual controls.
      - name: Execute no-model native boundary checks
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-qualification-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/native-qualification-home" \
            TMPDIR="$RUNNER_TEMP" COPILOT_SKIP_CLI_DOWNLOAD=1 \
            "$EVAL_PYTHON" eval/pipeline/tests/native_runtime_integration.py \
            --run-native --runtime-path "$COPILOT_CLI_EXTRACT_DIR/prebuilds/linux-x64/copilot-runtime"

      # No grades, percentages, run summaries, home uploads, or native raw-log artifacts.
      - name: Remove qualification provisioning
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/eval-venv" "$RUNNER_TEMP/eval-wheels" \
            "$COPILOT_CLI_EXTRACT_DIR" "$RUNNER_TEMP/native-qualification-home"
