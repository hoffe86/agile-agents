name: Eval · pipeline outcome (L2)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Evaluation suite to run
        type: choice
        options:
          - custom-eval
          - swe-bench-subset
        default: custom-eval
      task_filter:
        description: 'Only run tasks whose ID matches this regex'
        type: string
        default: '.*'
      pass_threshold:
        description: 'Resolved%% needed to exit 0 (see note below)'
        type: string
        default: '0'
      dry_run:
        description: 'Render the copilot command per task without executing (no auth/credits)'
        type: boolean
        default: true

# ponytail: dry_run defaults true — a free wiring check on a bare runner (no copilot, no auth,
# no credits). For a REAL run set dry_run=false AND add a repo secret COPILOT_CLI_TOKEN
# (fine-grained PAT with the "Copilot Requests" permission); the job then installs the Copilot
# CLI and authenticates with it. Both the dev-lead run and the LLM judge call copilot, so a real
# run consumes credits and is slow (the full multi-agent pipeline per task) — use task_filter to
# limit scope, and keep threshold 0 until you trust the scores. ubuntu-latest ships bash + jq.

jobs:
  pipeline-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ inputs.dry_run == false }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: ${{ inputs.dry_run == false }}
        run: npm install -g @github/copilot

      - name: Eval · pipeline outcome (L2) harness
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          else
            DRY=""
            if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
              echo "::error::Real run (dry_run=false) needs Copilot auth. Add a fine-grained PAT with the 'Copilot Requests' permission as the COPILOT_CLI_TOKEN repository secret, or run with dry_run=true."
              exit 1
            fi
          fi
          bash eval/pipeline/run-eval.sh \
            --suite "${{ inputs.suite }}" \
            --task-filter "${{ inputs.task_filter }}" \
            --pass-threshold "${{ inputs.pass_threshold }}" \
            $DRY

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Eval result — ${{ inputs.suite }}"
            echo '```json'
            cat eval/pipeline/runs/*/summary.json 2>/dev/null || echo 'no summary.json produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.suite }}-${{ github.run_id }}
          path: eval/pipeline/runs/
          if-no-files-found: error
