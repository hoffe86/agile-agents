name: Eval · DeepEval offline scoring

on:
  workflow_dispatch:
    inputs:
      trace_path:
        description: 'Repository-relative existing JSONL file/directory; default is a SYNTHETIC fixture'
        type: string
        default: eval/deepeval/tests/fixtures/skill-scoring-demo.jsonl
      expected_skills:
        description: 'JSON array of expected recorded skill identities; same expectations for every input'
        type: string
        default: '["fixture-skill-a"]'

# No fresh agents, model calls, generated-code execution, SDK or sandbox provisioning.
# Native experimentation is deferred to https://github.com/hoffe86/agile-agents/issues/22.
# Recorded invocation is not successful completion, task quality or L2 acceptance.
permissions:
  contents: read

jobs:
  pipeline-outcome:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRACE_PATH: ${{ inputs.trace_path }}
      EXPECTED_SKILLS: ${{ inputs.expected_skills }}
      EVAL_REQUIRE_DEEPEVAL: '1'
      DEEPEVAL_TELEMETRY_OPT_OUT: '1'
      DEEPEVAL_DISABLE_PROGRESS_BAR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Create a clean evaluation environment
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"

      # Only trusted dependency download needs PyPI; no runtime download or
      # provider credentials. Keep the shared evaluation lock unchanged.
      - name: Download hash-verified evaluation wheels
        run: >-
          python -m pip --isolated download --index-url https://pypi.org/simple
          --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/eval-wheels"
          --requirement eval/deepeval/requirements.lock.txt

      - name: Install evaluation wheels without an index
        run: >-
          python -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/eval-wheels"
          --require-hashes --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt

      - name: Check the installed dependency closure
        run: python -m pip check

      - name: Require real DeepEval and its deterministic contract
        run: python eval/deepeval/check_environment.py

      - name: Score existing recorded skill invocation
        id: scoring
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import runpy
          import sys

          root = Path.cwd().resolve()
          try:
              if not os.environ["TRACE_PATH"].strip():
                  raise ValueError
              supplied = Path(os.environ["TRACE_PATH"])
              if supplied.is_absolute():
                  raise ValueError
              source = supplied.resolve(strict=True)
              if not source.is_relative_to(root) or not (source.is_file() or source.is_dir()):
                  raise ValueError
              # Do not let directory collection follow file symlinks out of checkout.
              if source.is_dir():
                  for entry in source.rglob("*"):
                      if entry.is_symlink() or entry.suffix.lower() in {".log", ".jsonl"}:
                          if not entry.resolve(strict=True).is_relative_to(root):
                              raise ValueError
              expected = json.loads(os.environ["EXPECTED_SKILLS"])
              if not isinstance(expected, list) or not expected:
                  raise ValueError
              if any(not isinstance(skill, str) or not skill.strip() for skill in expected):
                  raise ValueError
              output = root / "eval/pipeline/runs/skill-usage-summary.json"
              if output.resolve() != output or output.exists():
                  raise ValueError
          except (ValueError, OSError, RuntimeError):
              print("::error::Use an existing repository-relative trace path, a nonempty JSON array of skill names, and a fresh owned output path.")
              raise SystemExit(2)

          # argv, never shell text; --option=value also preserves leading '-' in identities.
          sys.argv = [
              "eval/deepeval/report_skill_usage.py", str(source), "--score",
              *(f"--expect-skill={skill}" for skill in expected),
              "--output", str(output),
          ]
          try:
              runpy.run_path("eval/deepeval/report_skill_usage.py", run_name="__main__")
          finally:
              # Measured failures also produce summaries. Validation failures must
              # never publish a pre-existing report or a symlink target.
              if output.resolve() == output and output.is_file():
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
                      outputs.write("summary_ready=true\n")

      - name: Write summary
        if: always()
        shell: python
        env:
          SUMMARY_READY: ${{ steps.scoring.outputs.summary_ready }}
        run: |
          import json
          import os
          from pathlib import Path

          lines = ["## DeepEval offline scoring",
                   "Scope: expected recorded skill invocation only; NOT successful tool completion, task quality or L2 resolved acceptance.",
                   "Acceptance scoring remains UNVERIFIED. Live execution is unavailable (issue #22)."]
          try:
              fixture = Path("eval/deepeval/tests/fixtures/skill-scoring-demo.jsonl").resolve()
              is_fixture = Path(os.environ["TRACE_PATH"]).resolve() == fixture
          except (ValueError, OSError, RuntimeError):
              # Invalid paths must not break reporting of the validation failure.
              is_fixture = False
          if is_fixture:
              lines.append("SYNTHETIC fixture demonstration — NOT a current-harness benchmark.")
          else:
              lines.append("Existing repository traces; provenance is not established by this measurement.")
          report = Path("eval/pipeline/runs/skill-usage-summary.json")
          if os.environ.get("SUMMARY_READY") == "true" and report.is_file():
              data = json.loads(report.read_text(encoding="utf-8"))
              # Do not render operator labels or transcript data into Markdown.
              fields = ("status", "measured", "total", "threshold")
              lines.extend(["```json", json.dumps({key: data[key] for key in fields}), "```"])
          else:
              lines.append("No scoring summary produced; consult the failed step. No score inferred.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n\n".join(lines) + "\n")

      # Explicit summary allowlist, never runs/** or raw session transcripts.
      - name: Upload scoring summary
        if: always() && steps.scoring.outputs.summary_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-invocation-${{ github.run_id }}
          path: eval/pipeline/runs/skill-usage-summary.json
          if-no-files-found: error
          retention-days: 7
