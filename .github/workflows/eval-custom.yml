name: Eval · custom-eval live run (dev-lead)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task folder name or prefix under eval/pipeline/custom-eval/tasks, e.g. task-05'
        type: string
        default: task-05
      judge:
        description: 'Acceptance judge; none leaves criteria without a passing command check UNVERIFIED'
        type: choice
        options: [none, azure-openai]
        default: none
      max_ai_credits:
        description: 'Copilot AI-credit cap per phase (30-2000)'
        type: string
        default: '300'

# Four jobs, three trust zones:
#   plan       runs dev-lead UNSANDBOXED with every tool allowed (#22); records a skipped gate.
#   approve    an LLM simulates the human at the plan gate. Runs no agent,
#              reads the plan as data, holds OIDC for the judge and never the Copilot token.
#   implement  same agent, resumed only after the simulated approver approved.
#   score      DeepEval trajectory + judge; reads recorded files only, never runs agent output,
#              and can mint an OIDC token for the Azure OpenAI acceptance judge.
# The agent jobs use the short-lived GITHUB_TOKEN with read-only repository access and
# copilot-requests: write. Whichever finishes the change also runs the task's acceptance
# checks in the agent's workspace with a scrubbed environment; a missing tool is UNVERIFIED.
permissions:
  contents: read

concurrency:
  group: eval-custom-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: false

env:
  COPILOT_CLI_VERSION: 1.0.105
  DEEPEVAL_TELEMETRY_OPT_OUT: '1'
  DEEPEVAL_DISABLE_PROGRESS_BAR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # task-06's acceptance check; a pinned release, verified against its published checksum.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      status: ${{ steps.phase1.outputs.status }}
    env:
      TASK: ${{ inputs.task }}
      MAX_AI_CREDITS: ${{ inputs.max_ai_credits }}
    defaults:
      run:
        shell: bash
    steps:
      # Outside the checkout so the agent's workspace is its own git root.
      - name: Locate the run directory
        run: echo "RUN_DIR=$RUNNER_TEMP/custom-eval-run" >> "$GITHUB_ENV"

      - name: Validate inputs
        run: |
          [[ "$TASK" =~ ^task-[0-9]{2}(-[a-z0-9-]+)?$ ]] || { echo "::error::task must look like task-NN[-slug]"; exit 2; }
          [[ "$MAX_AI_CREDITS" =~ ^[0-9]{2,4}$ ]] && (( MAX_AI_CREDITS >= 30 && MAX_AI_CREDITS <= 2000 )) \
            || { echo "::error::max_ai_credits must be an integer in 30-2000"; exit 2; }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The .NET tasks target net10.0 and use .slnx in their acceptance checks.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install actionlint
        run: &install-actionlint |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint/actionlint" -version

      - name: Install the pinned evaluation lock and Copilot CLI
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt
          npm install --global "@github/copilot@${COPILOT_CLI_VERSION}"

      - name: Install task 02 Python tools
        run: &install-task02-tools |
          if [[ "$TASK" == task-02 || "$TASK" == task-02-* ]]; then
            python -m pip --isolated install --require-hashes --only-binary=:all: \
              --requirement eval/pipeline/custom-eval/requirements-task02.lock.txt
            python -m pip check
          fi

      - name: Phase 1 - run dev-lead up to the plan gate
        id: phase1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python eval/pipeline/run_custom_eval.py "$TASK" --out "$RUN_DIR" --phase 1 \
            --unsandboxed --max-ai-credits "$MAX_AI_CREDITS"
          # state.json is writable by the unsandboxed agent: allowlist before it drives a job.
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUN_DIR/state.json" || true)
          case "$status" in awaiting_approval|blocked_approval|gate_skipped|complete) ;; *) status=invalid ;; esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Show the plan to the approver
        if: always()
        shell: python
        run: |
          import json, os, re
          path = os.path.join(os.environ["RUN_DIR"], "state.json")
          try:
              with open(path, encoding="utf-8") as fh:
                  state = json.load(fh)
          except (OSError, ValueError):
              state = {"status": "setup_error"}
          def fenced(text):
              # Agent-written text: a fence longer than any backtick run renders it inert.
              text = str(text)
              run = max((len(m) for m in re.findall("`+", text)), default=0)
              fence = "`" * max(3, run + 1)
              return f"{fence}text\n{text}\n{fence}"
          status = state.get("status")
          known = {"awaiting_approval", "blocked_approval", "gate_skipped", "complete", "setup_error"}
          lines = [f"## custom-eval phase 1: {status if status in known else 'invalid state'}"]
          if status == "awaiting_approval":
              lines.append("The simulated approver (llm, eval-only) decides this plan in the approve job.")
          elif status == "blocked_approval":
              lines.append("The approval request could not be verified; the approver and phase 2 will not run.")
          elif status == "gate_skipped":
              lines += ["dev-lead implemented before approval; phase 2 will not run.",
                        fenced("\n".join(map(str, state.get("gate", {}).get("violations", []))))]
          lines += ["", "dev-lead's plan message (agent output, shown verbatim):", "",
                    fenced(state.get("plan_message") or "(none captured)")]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

      # The Copilot session (COPILOT_HOME) is carried to phase 2, so this artifact is
      # short-lived. Hidden dirs (.git, .github, .copilot-home) are part of the run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: custom-eval-plan
          path: ${{ env.RUN_DIR }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  approve:
    needs: plan
    if: ${{ needs.plan.outputs.status == 'awaiting_approval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Entra federated login for the simulated approver only
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
    env:
      TASK: ${{ inputs.task }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.EVAL_AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.EVAL_AZURE_OPENAI_DEPLOYMENT }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Locate the run directory
        run: echo "RUN_DIR=$RUNNER_TEMP/custom-eval-run" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the pinned evaluation lock
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: custom-eval-plan
          path: ${{ env.RUN_DIR }}

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.EVAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EVAL_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Reads the plan from the recorded state as data; executes nothing the agent wrote.
      - name: Simulated plan approval (LLM, eval-only)
        id: decide
        run: |
          python eval/pipeline/run_custom_eval.py "$TASK" --out "$RUN_DIR" --phase approve
          decision=$(python -c 'import json,sys; print("approved" if json.load(open(sys.argv[1]))["approved"] is True else "rejected")' "$RUN_DIR/plan-approval.json")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        shell: python
        run: |
          import html, json, os, re
          try:
              with open(os.path.join(os.environ["RUN_DIR"], "plan-approval.json"), encoding="utf-8") as fh:
                  decision = json.load(fh)
          except (OSError, ValueError):
              decision = {"approved": None, "judgement": {"criteria": []}}
          def cell(value):
              text = html.escape(" ".join(str(value).split()))
              return re.sub(r"([\\`*_\[\]()!|#~])", r"\\\1", text)[:300]
          verdict = {True: "approved", False: "rejected"}.get(decision.get("approved"), "no decision")
          lines = [f"## custom-eval plan approval (llm-simulated, eval-only): {verdict}", "",
                   "| criterion | result | reason |", "|---|---|---|"]
          for c in decision.get("judgement", {}).get("criteria", []):
              lines.append(f"| {cell(c.get('id'))} | {cell(c.get('status'))} | {cell(c.get('reason'))} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: custom-eval-approval
          path: ${{ env.RUN_DIR }}/plan-approval.json
          retention-days: 14
          if-no-files-found: error

  implement:
    needs: [plan, approve]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.status == 'awaiting_approval'
      && needs.approve.result == 'success' && needs.approve.outputs.decision == 'approved' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      copilot-requests: write
    env:
      TASK: ${{ inputs.task }}
      MAX_AI_CREDITS: ${{ inputs.max_ai_credits }}
    defaults:
      run:
        shell: bash
    steps:
      # Outside the checkout so the agent's workspace is its own git root.
      - name: Locate the run directory
        run: echo "RUN_DIR=$RUNNER_TEMP/custom-eval-run" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install actionlint
        run: *install-actionlint

      - name: Install the pinned evaluation lock and Copilot CLI
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt
          npm install --global "@github/copilot@${COPILOT_CLI_VERSION}"

      - name: Install task 02 Python tools
        run: *install-task02-tools

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: custom-eval-plan
          path: ${{ env.RUN_DIR }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: custom-eval-approval
          path: ${{ env.RUN_DIR }}

      - name: Phase 2 - resume the same session with the recorded approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python eval/pipeline/run_custom_eval.py "$TASK" --out "$RUN_DIR" --phase 2 \
            --unsandboxed --max-ai-credits "$MAX_AI_CREDITS"

      - name: Drop the Copilot session before publishing the run
        if: always()
        run: rm -rf "$RUN_DIR/.copilot-home"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: custom-eval-final
          path: ${{ env.RUN_DIR }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  score:
    needs: [plan, approve, implement]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Entra federated login for the azure-openai judge only
    env:
      JUDGE: ${{ inputs.judge }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.EVAL_AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.EVAL_AZURE_OPENAI_DEPLOYMENT }}
    defaults:
      run:
        shell: bash
    steps:
      # Outside the checkout so the agent's workspace is its own git root.
      - name: Locate the run directory
        run: echo "RUN_DIR=$RUNNER_TEMP/custom-eval-run" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the pinned evaluation lock
        run: |
          python -m venv "$RUNNER_TEMP/eval-venv"
          echo "$RUNNER_TEMP/eval-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip --isolated install --require-hashes \
            --only-binary=:all: --requirement eval/deepeval/requirements.lock.txt
          "$RUNNER_TEMP/eval-venv/bin/python" -m pip check
          "$RUNNER_TEMP/eval-venv/bin/python" eval/deepeval/check_environment.py

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.implement.result == 'success' && 'custom-eval-final' || 'custom-eval-plan' }}
          path: ${{ env.RUN_DIR }}

      # Always take the decision from the approve job, never the copy that passed through
      # the agent's job; a rejected plan never reaches implement at all.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.approve.result == 'success' }}
        with:
          name: custom-eval-approval
          path: ${{ env.RUN_DIR }}

      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        if: >-
          ${{ inputs.judge == 'azure-openai' &&
              (needs.plan.outputs.status == 'gate_skipped' ||
               needs.plan.outputs.status == 'complete' || needs.implement.result == 'success') }}
        with:
          client-id: ${{ vars.EVAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EVAL_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Score trajectory (DeepEval) and acceptance (judge)
        run: |
          python eval/pipeline/score_custom_eval.py "$RUN_DIR" --judge "$JUDGE" \
            --output "$RUNNER_TEMP/custom-eval-summary.json"

      - name: Write summary
        if: always()
        shell: python
        run: |
          import html, json, os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "custom-eval-summary.json")
          try:
              with open(path, encoding="utf-8") as fh:
                  report = json.load(fh)
          except (OSError, ValueError):
              report = {"status": "setup_error", "results": []}

          def cell(value):
              # Reasons quote names from the agent's trace: neutralise Markdown and HTML.
              text = html.escape(" ".join(str(value).split()))
              return re.sub(r"([\\`*_\[\]()!|#~])", r"\\\1", text)[:300]

          lines = [f"## custom-eval score: {cell(report['status'])} (judge: {cell(os.environ['JUDGE'])})",
                   "Trajectory is DeepEval ToolCorrectness over recorded skill and delegation calls. "
                   "Build, test and render criteria are decided by the acceptance commands the agent "
                   "job ran (a missing tool is UNVERIFIED, never FAIL); the judge grades the rest "
                   "from the captured diff and executes nothing.", "",
                   "| check | score | result | reason |", "|---|---|---|---|"]
          for row in report["results"]:
              for m in [row.get("plan_gate"), row.get("plan_approval")] + row.get("trajectory", []):
                  if m:
                      lines.append(f"| {cell(m['name'])} | {cell(m['score'])} | {cell(m['passed'])} "
                                   f"| {cell(m['reason'])} |")
              for c in row.get("checks") or []:
                  lines.append(f"| command c{cell(c.get('criterion'))} | - | {cell(c.get('status'))} "
                               f"| {cell(c.get('command'))}: {cell(c.get('reason'))} |")
              verdict = row.get("acceptance", {}).get("verdict", "-")
              lines.append(f"| acceptance | - | {cell(verdict)} | judge {cell(report.get('judge'))} |")
              for err in row.get("errors", []):
                  lines.append(f"| error | - | - | {cell(err)} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: custom-eval-summary
          path: ${{ runner.temp }}/custom-eval-summary.json
          if-no-files-found: warn
